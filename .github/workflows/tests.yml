name: tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        # The full requirements, not a subset: one test loads the cross-encoder and
        # another runs the OCR engine, so a "fast" install would only be fast by
        # skipping the tests that prove the pipeline works.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run
        run: pytest -q
